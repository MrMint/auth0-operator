name: Alethic.Auth0.Operator

on:
  workflow_dispatch:
  push:
    branches:
    - main
    - develop
  pull_request:
    branches:
    - main
    - develop
  release:
    types:
    - created

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.101
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3
      with:
        versionSpec: 5.x
    - name: Execute GitVersion
      uses: gittools/actions/gitversion/execute@v3
      with:
        useConfigFile: true
        configFilePath: GitVersion.yml
    - name: Add NuGet Source (GitHub)
      shell: pwsh
      run: dotnet nuget add source --username USERNAME --password $env:GITHUB_TOKEN --store-password-in-clear-text --name alethic $env:GITHUB_REPOS
      env:
        GITHUB_REPOS: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: NuGet Restore
      run: dotnet restore Alethic.Auth0.Operator.sln
    - name: Build
      run: |
        dotnet msbuild /m /bl \
          /p:Configuration="Release" \
          /p:Platform="Any CPU" \
          /p:Version=${GitVersion_FullSemVer} \
          /p:AssemblyVersion=${GitVersion_AssemblySemVer} \
          /p:InformationalVersion=${GitVersion_InformationalVersion} \
          /p:FileVersion=${GitVersion_AssemblySemFileVer} \
          /p:PackageVersion=${GitVersion_FullSemVer} \
          /p:RepositoryUrl="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" \
          /p:PackageProjectUrl="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
          /p:BuildInParallel=true \
          /p:CreateHardLinksForAdditionalFilesIfPossible=true \
          /p:CreateHardLinksForCopyAdditionalFilesIfPossible=true \
          /p:CreateHardLinksForCopyFilesToOutputDirectoryIfPossible=true \
          /p:CreateHardLinksForCopyLocalIfPossible=true \
          /p:CreateHardLinksForPublishFilesIfPossible=true \
          /p:ContinuousIntegrationBuild=true \
          Alethic.Auth0.Operator.dist.msbuildproj
    - name: Upload MSBuild Log
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: msbuild.binlog
        path: msbuild.binlog
    - name: Package Containers
      run: tar czvf /tmp/containers.tar.gz containers
      working-directory: dist
    - name: Upload Containers
      uses: actions/upload-artifact@v4
      with:
        name: containers
        path: /tmp/containers.tar.gz
    - name: Package Charts
      run: tar czvf /tmp/charts.tar.gz charts
      working-directory: dist
    - name: Upload Charts
      uses: actions/upload-artifact@v4
      with:
        name: charts
        path: /tmp/charts.tar.gz
    - name: Package Tests
      run: tar czvf /tmp/tests.tar.gz tests
      working-directory: dist
    - name: Upload Tests
      uses: actions/upload-artifact@v4
      with:
        name: tests
        path: /tmp/tests.tar.gz
  release:
    name: Release
    if: github.event_name != 'pull_request'
    needs:
    - build
    runs-on: ubuntu-22.04
    env:
      OWNER_LC: ${{ github.repository_owner }}
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Setup .NET 9.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.101
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v3
      with:
        versionSpec: 5.x
    - name: Execute GitVersion
      id: GitVersion
      uses: gittools/actions/gitversion/execute@v3
      with:
        useConfigFile: true
    - name: Download Containers
      uses: actions/download-artifact@v4
      with:
        name: containers
        path: dist
    - name: Restore Containers
      run: tar xzvf containers.tar.gz
      working-directory: dist
    - name: Download Charts
      uses: actions/download-artifact@v4
      with:
        name: charts
        path: dist
    - name: Restore Charts
      run: tar xzvf charts.tar.gz
      working-directory: dist
    - name: Create Release
      if: github.ref_type == 'tag'
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.GitVersion.outputs.semVer }}
        allowUpdates: true
        omitBodyDuringUpdate: true
        artifacts: dist/containers/*.tar,dist/charts/*.tgz,dist/charts/auth0-operator.crds.yaml
        makeLatest: true
        token: ${{ secrets.GITHUB_TOKEN }}
    - name: Set Lowercase Owner
      run: echo "OWNER_LC=${OWNER_LC,,}" >> $GITHUB_ENV
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Push Multi-Arch Containers (GitHub)
      if: github.event_name != 'pull_request'
      run: |
        IMAGE_NAME="ghcr.io/${{ env.OWNER_LC }}/auth0-operator-image"
        VERSION="${{ steps.GitVersion.outputs.semVer }}"
        
        echo "Loading AMD64 image..."
        docker load -i dist/containers/auth0-operator-image-linux-x64.tar
        AMD64_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep auth0-operator-image | head -1)
        docker tag "$AMD64_IMAGE" "${IMAGE_NAME}:${VERSION}-amd64"
        docker push "${IMAGE_NAME}:${VERSION}-amd64"
        
        echo "Loading ARM64 image..."
        docker load -i dist/containers/auth0-operator-image-linux-arm64.tar
        ARM64_IMAGE=$(docker images --format "{{.Repository}}:{{.Tag}}" | grep auth0-operator-image | grep -v amd64 | head -1)
        docker tag "$ARM64_IMAGE" "${IMAGE_NAME}:${VERSION}-arm64"
        docker push "${IMAGE_NAME}:${VERSION}-arm64"
        
        echo "Creating and pushing multi-arch manifest..."
        docker buildx imagetools create -t "${IMAGE_NAME}:${VERSION}" \
          "${IMAGE_NAME}:${VERSION}-amd64" \
          "${IMAGE_NAME}:${VERSION}-arm64"
        
        echo "✅ Multi-arch manifest created for ${IMAGE_NAME}:${VERSION}"
    - name: Verify Multi-Arch Container Image
      if: github.event_name != 'pull_request'
      run: |
        echo "Verifying multi-arch container image was pushed successfully..."
        docker buildx imagetools inspect ghcr.io/${{ env.OWNER_LC }}/auth0-operator-image:${{ steps.GitVersion.outputs.semVer }}
        echo "✅ Multi-arch container image ghcr.io/${{ env.OWNER_LC }}/auth0-operator-image:${{ steps.GitVersion.outputs.semVer }} verified"
    - name: Verify Helm Chart Image Reference
      if: github.event_name != 'pull_request'
      run: |
        echo "Verifying Helm chart references correct image repository..."
        EXPECTED_REPO="ghcr.io/${{ env.OWNER_LC }}/auth0-operator-image"
        CHART_REPO=$(tar -xzOf dist/charts/*.tgz auth0-operator/values.yaml | grep -A1 'image:' | grep 'repository:' | awk '{print $2}')
        if [ "$CHART_REPO" != "$EXPECTED_REPO" ]; then
          echo "❌ ERROR: Helm chart references '$CHART_REPO' but container was pushed to '$EXPECTED_REPO'"
          echo "Please update charts/auth0-operator/values.yaml to use the correct image repository"
          exit 1
        fi
        echo "✅ Helm chart correctly references $EXPECTED_REPO"
    - name: Push Charts (GitHub)
      if: github.event_name != 'pull_request'
      run: helm push dist/charts/*.tgz oci://ghcr.io/${{ env.OWNER_LC }}
  