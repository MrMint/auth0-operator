apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: auth0roles.kubernetes.auth0.com
spec:
  group: kubernetes.auth0.com
  names:
    kind: Auth0Role
    listKind: Auth0RoleList
    plural: auth0roles
    singular: auth0role
    shortNames:
      - a0role
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tenantRef
                - conf
              properties:
                policy:
                  type: array
                  items:
                    type: string
                    enum:
                      - Create
                      - Update
                      - Delete
                tenantRef:
                  type: object
                  required:
                    - name
                  properties:
                    namespace:
                      type: string
                    name:
                      type: string
                find:
                  type: object
                  properties:
                    id:
                      type: string
                    nameFilter:
                      type: string
                init:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
                conf:
                  type: object
                  properties:
                    name:
                      type: string
                    description:
                      type: string
            status:
              type: object
              properties:
                id:
                  type: string
                lastConf:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Id
          type: string
          jsonPath: .status.id
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
