apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rolepermissions.kubernetes.auth0.com
spec:
  group: kubernetes.auth0.com
  names:
    kind: RolePermission
    listKind: RolePermissionList
    plural: rolepermissions
    singular: rolepermission
    shortNames:
      - a0rp
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - tenantRef
                - roleRef
                - resourceServerRef
                - conf
              properties:
                policy:
                  type: array
                  items:
                    type: string
                    enum:
                      - Create
                      - Update
                      - Delete
                tenantRef:
                  type: object
                  required:
                    - name
                  properties:
                    namespace:
                      type: string
                    name:
                      type: string
                roleRef:
                  type: object
                  required:
                    - name
                  properties:
                    namespace:
                      type: string
                    name:
                      type: string
                    id:
                      type: string
                resourceServerRef:
                  type: object
                  properties:
                    namespace:
                      type: string
                    name:
                      type: string
                    id:
                      type: string
                    identifier:
                      type: string
                init:
                  type: object
                  properties:
                    permissions:
                      type: array
                      items:
                        type: string
                conf:
                  type: object
                  properties:
                    permissions:
                      type: array
                      items:
                        type: string
            status:
              type: object
              properties:
                id:
                  type: string
                roleAuth0Id:
                  type: string
                resourceServerIdentifier:
                  type: string
                syncedPermissions:
                  type: array
                  items:
                    type: string
                lastConf:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Role
          type: string
          jsonPath: .status.roleAuth0Id
        - name: ResourceServer
          type: string
          jsonPath: .status.resourceServerIdentifier
        - name: Permissions
          type: string
          jsonPath: .status.syncedPermissions
          description: List of synced permissions
          priority: 1
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
