# CRD Management
# ==============
# CRDs are located in the chart's crds/ directory and are managed by Helm.
#
# Helm Behavior:
# - helm install: CRDs are installed automatically (use --skip-crds to skip)
# - helm template: CRDs are NOT included by default (use --include-crds to include)
#
# This means cdk8s and other tools using "helm template" will NOT get CRDs
# by default, preventing duplication when CRDs are managed externally.
#
# To include CRDs in helm template output:
#   helm template auth0-operator oci://ghcr.io/mrmint/auth0-operator --include-crds
#
# To skip CRDs during helm install:
#   helm install auth0-operator oci://ghcr.io/mrmint/auth0-operator --skip-crds
#
# External CRD Management (recommended for GitOps/ArgoCD):
# Use the static CRD bundle from releases:
#   https://github.com/MrMint/auth0-operator/releases/download/<version>/auth0-operator.crds.yaml
#
# This allows you to:
# - Control CRD deployment timing with ArgoCD sync waves
# - Manage CRD lifecycle independently from the operator
# - Avoid CRD duplication warnings

operator:
  env: []

  # An array of additional annotations to be applied to the operator service account
  serviceAccountAnnotations: []

  # additional labels to be applied to operator resources
  additionalLabels: {}

  # Specify the Operator container image to use for the deployment.
  # NOTE: This fork uses ghcr.io/mrmint/... instead of upstream's ghcr.io/alethic/...
  image:
    repository: ghcr.io/mrmint/auth0-operator-image
    pullPolicy: IfNotPresent

  # An array of Kubernetes secrets to use for pulling images from a private ``image.repository``.
  # Only one array element is supported at this time.
  imagePullSecrets: [ ]

  # An array of `initContainers <https://kubernetes.io/docs/concepts/workloads/pods/init-containers/>`__ to start up before the Operator pods.
  initContainers: [ ]

  # The number of Operator pods to deploy.
  replicaCount: 1

  # You may need to modify these values to meet your cluster's security and access settings.
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    fsGroup: 1000

  # You may need to modify these values to meet your cluster's security and access settings.
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

  # The volumes must exist *and* be accessible to the Operator pods.
  volumes: [ ]

  # An array of volume mount points associated to each Operator container.
  volumeMounts: [ ]

  # Any `Node Selectors <https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/>`__ to apply to Operator pods.
  nodeSelector: { }

  # The `Pod Priority <https://kubernetes.io/docs/concepts/scheduling-eviction/pod-priority-preemption/>`__ to assign to Operator pods.
  priorityClassName: ""

  # The `affinity <https://kubernetes.io/docs/tasks/configure-pod-container/assign-pods-nodes-using-node-affinity/>`__ or anti-affinity settings to apply to Operator pods.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: name
                operator: In
                values:
                  - auth0-operator
          topologyKey: kubernetes.io/hostname

  # An array of `Toleration labels <https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/>`__ to associate to Operator pods.
  tolerations: [ ]

  # An array of `Topology Spread Constraints <https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/>`__ to associate to Operator pods.
  topologySpreadConstraints: [ ]

  # The `Requests or Limits <https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/>`__ for resources to associate to Operator pods.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Various configuration options.
options:
  # Limit operation to the single specified namespace. This can be used to install a namespace-specific instance of the operator.
  # NOT YET SUPPORTED
  # namespace: "my-namespace"

  # Reconciliation behavior options
  reconciliation:
    # Base interval between periodic reconciliation cycles for drift detection.
    # CRD changes are still reconciled immediately via watch events.
    # Default: 10m
    # interval: "10m"
    
    # Enable jitter to spread reconciliations across time.
    # When enabled, each entity gets a deterministic offset based on its name.
    enableJitter: true
    
    # Maximum jitter to add to reconciliation interval.
    # Entities will be spread across [0, MaxJitter) window.
    # Default: 5m
    # maxJitter: "5m"
    
    # Enable spreading initial reconciliations when operator starts.
    # This prevents a thundering herd on operator startup.
    enableStartupSpread: true
    
    # Window over which to spread initial reconciliations on startup.
    # Default: 2m
    # startupSpreadWindow: "2m"
    
    # Minimum interval between reconciliations when rate limited.
    # Default: 5m
    # minThrottledInterval: "5m"

  # Rate limiting options for Auth0 API calls
  # Based on Auth0 Self Service Management API limits (25-200 requests/minute per endpoint)
  rateLimit:
    # Enable proactive throttling based on X-RateLimit headers.
    # When enabled, the operator will slow down when approaching rate limits.
    enableProactiveThrottling: true
    
    # Reconciliation interval when approaching rate limits (seconds).
    throttledReconciliationIntervalSeconds: 300
    
    # Minimum delay after hitting rate limit (seconds).
    minRateLimitDelaySeconds: 60
    
    # Default tier assumption for new tenants (SelfService or Enterprise).
    # Affects initial rate limit estimates before first API response.
    defaultTier: "SelfService"
    
    # Target requests per minute for pacing.
    # Auth0 Self Service allows 25-200 requests/minute per endpoint.
    # Conservative default to stay well under limits.
    targetRequestsPerMinute: 30
